buildscript {
    ext {
        // ✅ Keep your SDK versions but upgrade AGP
        buildToolsVersion = "34.0.0"
        compileSdkVersion = 34
        targetSdkVersion = 34

        minSdkVersion = 23
        ndkVersion = "25.1.8937393"

        // ✅ RN 0.72 works with Kotlin 1.8.x
        kotlinVersion = "1.8.22"

        // ✅ Upgrade AGP to support SDK 34
        androidGradlePluginVersion = "8.1.0" // or "8.0.2"
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:$androidGradlePluginVersion")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.google.gms:google-services:4.4.0")
    }
}
// Add this at the very bottom of your android/build.gradle file

allprojects {
    plugins.withType(com.android.build.gradle.LibraryPlugin) {
        android {
            // Force namespace for all library projects
            if (project.file('src/main/AndroidManifest.xml').exists()) {
                def manifest = new XmlSlurper().parse(project.file('src/main/AndroidManifest.xml'))
                namespace = manifest.@package.text()
            } else {
                namespace = "com.temp.${project.name}"
            }
            
            // Force buildConfig enabled
            buildFeatures {
                buildConfig true
            }
            
            // Set consistent versions
            compileSdk 33
            buildToolsVersion "33.0.0"
            
            defaultConfig {
                minSdk 23
                targetSdk 33
            }
            
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
        }
    }
}

subprojects { subproject ->
    afterEvaluate {
        if ((subproject.plugins.hasPlugin('android') || subproject.plugins.hasPlugin('android-library'))) {
            // Ensure namespace is set
            if (!subproject.android.hasProperty('namespace') || subproject.android.namespace == null) {
                try {
                    def manifestFile = subproject.file('src/main/AndroidManifest.xml')
                    if (manifestFile.exists()) {
                        def xml = new XmlParser().parse(manifestFile)
                        subproject.android.namespace = xml.@package
                        println "Set namespace for ${subproject.name}: ${xml.@package}"
                    }
                } catch (Exception e) {
                    subproject.android.namespace = "com.temp.${subproject.name}"
                    println "Set default namespace for ${subproject.name}"
                }
            }
            
            // Ensure buildConfig is enabled
            subproject.android.buildFeatures.buildConfig = true
        }
    }
}