apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

react {
    /* React configuration (keep as is) */
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    // Use the version from rootProject (which we'll set to 33)
    ndkVersion rootProject.ext.ndkVersion
    compileSdk rootProject.ext.compileSdkVersion  // Use rootProject value

    namespace "com.icmsapp"
    defaultConfig {
        applicationId "com.icmsapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion  // Use rootProject value
        versionCode 1
        versionName "1.0"
        
        // === ADD THESE WEBRTC CONFIGURATIONS ===
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        
        // WebRTC NDK configuration
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }
    
    // Add buildFeatures block for BuildConfig
    buildFeatures {
        buildConfig true
    }
    
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file(MYAPP_RELEASE_STORE_FILE)
            storePassword MYAPP_RELEASE_STORE_PASSWORD
            keyAlias MYAPP_RELEASE_KEY_ALIAS
            keyPassword MYAPP_RELEASE_KEY_PASSWORD
        }
    }
    
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // === ADD PACKAGING OPTIONS FOR WEBRTC ===
    packagingOptions {
        pickFirst '**/libjsc.so'
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libfbjni.so'
        // WebRTC specific exclusions
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
        exclude '**/libopenh264.so'
    }
    
    // === ADD LINT OPTIONS TO IGNORE WEBRTC WARNINGS ===
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation project(':react-native-svg')
    
    // === ADD WEBRTC AND RELATED DEPENDENCIES ===
    implementation project(':react-native-webrtc')
    
    // Use compatible AndroidX versions for RN 0.72
    implementation "androidx.core:core:1.9.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    
    // MultiDex support for WebRTC
    implementation "androidx.multidex:multidex:2.0.1"
    
    // WebRTC required dependencies - EXCLUDE constraintlayout from material to avoid conflict
    implementation("com.google.android.material:material:1.8.0") {
        exclude group: 'androidx.constraintlayout', module: 'constraintlayout'
    }
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    
    // FLIPPER HAS BEEN COMPLETELY REMOVED TO RESOLVE BUILD ISSUES
    
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// === SIMPLIFIED RESOLUTION STRATEGY FOR WEBRTC COMPATIBILITY ===
// === COMPATIBLE RESOLUTION STRATEGY ===
configurations.all {
    resolutionStrategy {
        // Force compatible AndroidX versions for your chosen SDK
        force 'androidx.core:core:1.12.0'
        force 'androidx.core:core-ktx:1.12.0'
        force 'androidx.activity:activity:1.8.0'
        force 'androidx.appcompat:appcompat:1.6.1'
        force 'androidx.constraintlayout:constraintlayout:2.1.4'
        
        preferProjectModules()
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation project(':react-native-svg')
    implementation project(':react-native-webrtc')
    
    // Use versions compatible with your chosen SDK
    implementation "androidx.core:core:1.12.0"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.activity:activity:1.8.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.multidex:multidex:2.0.1"
    
    implementation("com.google.android.material:material:1.9.0") {
        exclude group: 'androidx.constraintlayout', module: 'constraintlayout'
    }
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"